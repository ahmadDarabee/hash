global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s

# =========================
# STATS UI
# =========================
listen stats
  bind *:8404
  stats enable
  stats uri /
  stats refresh 5s

# =========================
# FRONTEND
# =========================
frontend http_in
  bind *:80

  acl host_api     hdr(host) -i api.localhost
  acl host_app     hdr(host) -i dashboard.localhost
  acl host_adminer hdr(host) -i adminer.localhost

  use_backend api_backend     if host_api
  use_backend app_backend     if host_app
  use_backend adminer_backend if host_adminer

# =========================
# BACKENDS
# =========================
backend api_backend
  balance roundrobin
  option httpchk GET /api/v1/utils/health-check/
  server api backend:8000 check

backend app_backend
  server app frontend:80 check

backend adminer_backend
  server adminer adminer:8080 check
