services:
  postgres:
    image: postgres:15
    ports:
      - 5432:5432
    # volumes:
    #   - ./db:.

  keycloak: 
    image: quay.io/keycloak/keycloak:latest
    ports:
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=ADMIN
      - KEYCLOAK_ADMIN_PASSWORD=ADMIN-PASSWORD

    command: start-dev
    # volumes:
    #   - type: bind
    #     source: ./gitignore 
    #     target: .

  backend:
    build:
      context: .
      dockerfile: dockerfile
    
     
    ports:
      - 8000:8080

  frontend:  
    build: 
      context: ./frontend
      dockerfile: Dockerfile 
      target: builder
    ports:
      - 3000:3000
    environment:
      - name=value
    command: >  #this command will run in the container when it starts

      sh -c "echo '
      starting frontend development server ...

      Running on http://localhost:3000
      '
      && npm run start -- host 0.0.0.0 -port 3000"
      
    
    depends_on:
      - backend
    
    restart: unless-stopped



