[project]
name = "hash-backend"
version = "0.1.0"
description = "Hash cleaning materials API (FastAPI + asyncpg, raw SQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "domain", "application", "infrastructure", "api"]

[tool.uv]
dev-dependencies = []
